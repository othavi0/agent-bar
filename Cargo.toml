[package]
name = "agent-bar"
version = "9.0.0"
edition = "2021"
# 1.88: piso real, não 1.80 — tachyonfx (via anpa) exige 1.82.
rust-version = "1.88"
license = "MIT"
description = "LLM quota monitor for Claude, Codex, Amp, and Grok."
repository = "https://github.com/othavi0/agent-bar"

[[bin]]
name = "agent-bar"
path = "src/main.rs"

[[bin]]
name = "agent-bar-bundle"
path = "src/bin/agent-bar-bundle.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "local-offset", "formatting", "parsing", "macros"] } # usado a partir do Plano 02 (local-offset p/ formatResetTime)
redb = "2.6.3"
postcard = { version = "1.1.3", features = ["alloc"] }
tempfile = "3"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "io-std", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
futures = "0.3"
regex = "1"
indexmap = { version = "2", features = ["serde"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-input = "0.15.3"
throbber-widgets-tui = "0.11.1"
tachyonfx = "0.25"
semver = "1.0.28"
fs2 = "0.4.3"
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.11.0"
tar = "0.4.46"
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
temp-env = { version = "0.3", features = ["async_closure"] }
insta = { version = "1", features = ["filters"] }
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
filetime = "0.2"
jsonschema = { version = "0.33", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
